# Alembic configuration. Migrations always run as the `migrator` role.
#
# The database URL is NOT set here: migrations/env.py reads it from
# MIGRATOR_DATABASE_URL (environment or .env), so no credentials live in this file
# and Alembic can never pick up the application's DATABASE_URL by accident.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Timestamped file names keep revisions in creation order in the file listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# New revision files are lint-fixed and formatted so they pass CI as generated
# (e.g. unused imports in an empty revision are dropped).
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# --- logging ------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
