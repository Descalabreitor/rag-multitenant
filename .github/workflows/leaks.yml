name: Leaks (nightly)

# The leak suite with the "nightly" Hypothesis profile (tests/conftest.py):
# thousands of random worlds in tests/leaks/test_properties.py instead of the
# couple of hundred that ci.yml runs on every push. Same compose postgres and
# placeholder environment as ci.yml; this is `make leaks` without writing to
# docs/results/ (the report goes to the run summary instead).
on:
  schedule:
    - cron: "47 3 * * *" # 03:47 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leaks:
    name: Leak suite (Hypothesis nightly profile)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Load placeholder environment
        run: |
          cp .env.example .env
          grep -Ev '^\s*(#|$)' .env.example >> "$GITHUB_ENV"

      - name: Start PostgreSQL + pgvector
        run: docker compose up -d --wait --wait-timeout 120 postgres

      - name: Apply migrations (as migrator)
        run: alembic upgrade head

      - name: pytest -m leaks (nightly profile)
        env:
          HYPOTHESIS_PROFILE: nightly
          LEAKS_REPORT: ${{ runner.temp }}/leaks.md
        run: pytest -m leaks

      # The "0 leaks in N attempts" report (or FAILED), written by the hook in
      # tests/leaks/conftest.py.
      - name: Report to the run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/leaks.md" ]; then
            cat "$RUNNER_TEMP/leaks.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - if: always()
        run: docker compose down -v
