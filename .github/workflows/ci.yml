name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy

  tests:
    name: Tests (unit + db)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      # Same compose file and init script as local development, so CI checks
      # the real role setup. Placeholder values from .env.example are fine here.
      - name: Load placeholder environment
        run: |
          cp .env.example .env
          grep -Ev '^\s*(#|$)' .env.example >> "$GITHUB_ENV"

      - name: Start PostgreSQL + pgvector
        run: docker compose up -d --wait --wait-timeout 120 postgres

      - run: pytest

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - if: always()
        run: docker compose down -v
