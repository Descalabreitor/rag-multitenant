name: E2E

# Manual only: starting Keycloak and Ollama takes a few minutes, so the
# end-to-end check stays out of the default CI run (ci.yml). Run it from the
# Actions tab.
#
# Cost of the chat model (llama3.1:8b, about 4.9 GB): the first run downloads it
# (a few minutes) and saves it to the Actions cache, which counts against the
# repository's 10 GB cache quota; later runs restore it instead. On a hosted
# runner it answers on the CPU, roughly half a minute to two minutes per
# question, for the handful of questions in tests/e2e/test_ask.py. Tick
# "fake_chat" to answer with FakeChat instead: no chat model pulled or cached,
# the same access and citation checks, and a run that is minutes shorter.
on:
  workflow_dispatch:
    inputs:
      fake_chat:
        description: "Answer /ask with FakeChat and skip the chat model (llama3.1:8b)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: End to end (Keycloak + PostgreSQL + Ollama + API)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      # Placeholder values, as in ci.yml. They enable the dev-only password
      # client (KC_DEV_PASSWORD_CLIENT=true) that the tests get tokens from.
      - name: Load placeholder environment
        run: |
          cp .env.example .env
          grep -Ev '^\s*(#|$)' .env.example >> "$GITHUB_ENV"

      # Ollama keeps its data in a host directory instead of the named volume
      # (compose.yaml reads OLLAMA_DATA_DIR), so the models can be cached between
      # runs. The key names the models from .env.example (the chat model only
      # when it is pulled) and changes with compose.yaml, which pins the Ollama
      # image.
      - name: Ollama data directory
        run: echo "OLLAMA_DATA_DIR=$RUNNER_TEMP/ollama" >> "$GITHUB_ENV"
      - name: Restore the models
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ollama/models
          key: ollama-nomic-embed-text${{ !inputs.fake_chat && '-llama3.1-8b' || '' }}-${{ hashFiles('compose.yaml') }}

      # Starts postgres, keycloak and ollama, pulls the models (a no-op download
      # when the cache hit), migrates, starts the API, runs pytest -m e2e.
      - run: make e2e FAKE_CHAT=${{ inputs.fake_chat && '1' || '' }}

      # The container writes as root; the cache action runs as the runner user.
      - name: Save the models
        id: model-owner
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          if [ -d "$OLLAMA_DATA_DIR/models" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$OLLAMA_DATA_DIR/models"
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - if: always() && steps.model-owner.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ollama/models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - if: always()
        run: docker compose down -v
