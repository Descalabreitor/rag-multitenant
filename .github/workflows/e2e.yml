name: E2E

# Manual only: starting Keycloak takes a minute or two, so the end-to-end check
# stays out of the default CI run (ci.yml). Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End to end (Keycloak + PostgreSQL + API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      # Placeholder values, as in ci.yml. They enable the dev-only password
      # client (KC_DEV_PASSWORD_CLIENT=true) that the tests get tokens from.
      - name: Load placeholder environment
        run: |
          cp .env.example .env
          grep -Ev '^\s*(#|$)' .env.example >> "$GITHUB_ENV"

      # Starts postgres and keycloak, migrates, starts the API, runs pytest -m e2e.
      - run: make e2e

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - if: always()
        run: docker compose down -v
